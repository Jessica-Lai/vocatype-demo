<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VocaType Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:720px;margin:40px auto;padding:0 16px}
    h1{margin-bottom:6px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px}
    .meta{opacity:.75;margin:8px 0}
    input{font-size:18px;padding:10px;width:100%;border-radius:8px;border:1px solid #ccc}
    button{margin-top:10px;padding:8px 14px;border-radius:8px;border:1px solid #ccc;cursor:pointer}
    .ok{color:#0a7f2e}
    .bad{color:#b00020}
    .kbd{font-family:ui-monospace,Menlo,monospace}
  </style>
</head>
<body>
  <h1>VocaType — Day 1 Demo</h1>
  <p class="meta">Type the English word for the Chinese meaning.</p>

  <div class="card">
    <div id="prompt" class="meta"></div>
    <input id="answer" placeholder="Type here and press Enter" autocomplete="off"/>
    <div id="feedback" class="meta"></div>
    <button id="next">Next</button>
  </div>

<script>
const words = [
  {term:"achieve", zh:"達成"},
  {term:"allergic", zh:"過敏的"},
  {term:"origami", zh:"摺紙"}
];

let i = 0;
let start = Date.now();

const promptEl = document.getElementById("prompt");
const ansEl = document.getElementById("answer");
const fbEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next");

function wpm(chars, ms){
  const min = ms/60000;
  return Math.round((chars/5)/Math.max(min,0.001));
}

function show(){
  const w = words[i];
  promptEl.innerHTML = `Meaning: <b>${w.zh}</b>`;
  fbEl.textContent = "";
  ansEl.value = "";
  ansEl.focus();
  start = Date.now();
}

ansEl.addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const typed = ansEl.value.trim();
  const target = words[i].term;
  const speed = wpm(typed.length, Date.now()-start);

  if(typed.toLowerCase() === target){
    fbEl.innerHTML = `<span class="ok">Correct</span> · ${speed} WPM`;
  }else{
    fbEl.innerHTML = `<span class="bad">Not quite</span> · answer: <b>${target}</b> · ${speed} WPM`;
  }
});

nextBtn.onclick = ()=>{
  i = (i+1)%words.length;
  show();
};

show();
</script>
</body>
</html>
