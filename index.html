<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>vocatype-demo v2 (use_word)</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial; margin: 20px; }
    .box { border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .row { margin: 6px 0; }
    input[type="text"] { width: 360px; padding: 6px; }
    button { padding: 6px 10px; }
    .small { color: #666; font-size: 12px; }
    .ok { color: #0a7; }
    .bad { color: #c22; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>vocatype-demo v2（use_word 當答案）</h2>

  <div class="box">
    <div class="row">
      <label>API Base URL：</label>
      <input id="apiBase" type="text" value="http://127.0.0.1:8000" />
      <span class="small">（後端跑在本機時用這個）</span>
    </div>
    <div class="row">
      <label>User ID：</label>
      <input id="userId" type="text" value="demo_user" />
    </div>
  </div>

  <div class="box">
    <h3>1) 匯入檔案（TSV/CSV）</h3>
    <input id="fileInput" type="file" />
    <button onclick="doImport()">Import</button>
    <pre id="importResult" class="small"></pre>
  </div>

  <div class="box">
    <h3>2) 取得 Top30 題目</h3>
    <button onclick="loadTop30()">Load Top30</button>
    <div id="count" class="small"></div>
  </div>

  <div class="box">
    <h3>3) 作答</h3>
    <div id="qArea"></div>
    <div class="row">
      <input id="answerInput" type="text" placeholder="輸入英文答案（use_word）" />
      <button onclick="submitAnswer()">Submit</button>
    </div>
    <div id="feedback" class="small"></div>
  </div>

<script>
let items = [];
let idx = 0;

function apiBase(){ return document.getElementById("apiBase").value.replace(/\/+$/,''); }
function userId(){ return document.getElementById("userId").value.trim() || "demo_user"; }

async function doImport(){
  const f = document.getElementById("fileInput").files[0];
  if(!f){ alert("請先選檔案"); return; }
  const fd = new FormData();
  fd.append("file", f);

  const url = `${apiBase()}/import?user_id=${encodeURIComponent(userId())}`;
  const res = await fetch(url, { method:"POST", body: fd });
  const data = await res.json();
  document.getElementById("importResult").textContent = JSON.stringify(data, null, 2);
}

async function loadTop30(){
  const url = `${apiBase()}/quiz/top30?user_id=${encodeURIComponent(userId())}`;
  const res = await fetch(url);
  const data = await res.json();
  items = data.items || [];
  idx = 0;
  document.getElementById("count").textContent = `取得題目數：${items.length}`;
  renderQuestion();
}

function renderQuestion(){
  const q = items[idx];
  const area = document.getElementById("qArea");
  const fb = document.getElementById("feedback");
  fb.textContent = "";
  document.getElementById("answerInput").value = "";
  if(!q){
    area.innerHTML = "<div class='ok'>目前沒有題目（先 Import，再 Load Top30）</div>";
    return;
  }
  const p = q.prompt;
  area.innerHTML = `
    <div class="row"><b>Q${idx+1}</b>（請輸入 use_word）</div>
    <div class="row"><b>中文：</b>${esc(p.zh_meaning || "")}</div>
    <div class="row"><b>base_word：</b>${esc(p.base_word || "")}</div>
    <div class="row"><b>pos：</b>${esc(p.target_pos || "")}</div>
    <div class="row"><b>IPA：</b>${esc(p.ipa || "")}</div>
    <div class="row"><b>例句 EN：</b>${esc(p.example_en || "")}</div>
    <div class="row"><b>例句 ZH：</b>${esc(p.example_zh || "")}</div>
    <div class="row"><b>phrases：</b>${esc(p.phrases || "")}</div>
    <div class="row"><b>note：</b>${esc(p.note || "")}</div>
    <div class="small">priority_score: ${q.meta.priority_score.toFixed(2)} | attempts: ${q.meta.total_attempts}</div>
  `;
}

async function submitAnswer(){
  const q = items[idx];
  if(!q){ return; }
  const ans = document.getElementById("answerInput").value;

  const url = `${apiBase()}/quiz/answer`;
  const res = await fetch(url, {
    method:"POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({
      user_id: userId(),
      voca_item_id: q.voca_item_id,
      user_answer: ans
    })
  });
  const data = await res.json();

  const fb = document.getElementById("feedback");
  if(data.is_correct){
    fb.innerHTML = `<span class="ok">✔ Correct</span> | error_rate=${(data.error_rate||0).toFixed(2)}`;
  }else{
    fb.innerHTML = `<span class="bad">✘ Wrong</span> | 正確答案：<b>${esc(data.correct_answer||"")}</b> | error_rate=${(data.error_rate||0).toFixed(2)}`;
  }

  idx += 1;
  if(idx >= items.length){
    fb.innerHTML += "<div class='ok'>已完成本輪題目。再 Load Top30 會依錯誤率重排。</div>";
  }else{
    renderQuestion();
  }
}

function esc(s){
  return (s||"").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
</script>
</body>
</html>
