<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VocaType — Day 3 Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:760px;margin:40px auto;padding:0 16px}
    h1{margin-bottom:6px}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:12px}
    .meta{opacity:.75;margin:8px 0}
    input[type="text"]{font-size:18px;padding:10px;width:100%;border-radius:8px;border:1px solid #ccc}
    input[type="file"]{margin-top:8px}
    button{margin-top:8px;padding:8px 14px;border-radius:8px;border:1px solid #ccc;cursor:pointer}
    .ok{color:#0a7f2e}
    .bad{color:#b00020}
    .row{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <h1>VocaType — Day 3 Demo</h1>
  <p class="meta">Import a CSV (term, zh). The app will speak the word.</p>

  <!-- Import -->
  <div class="card">
    <b>Import Vocabulary (CSV)</b>
    <p class="meta">Format: term, zh (first row as header)</p>
    <input type="file" id="fileInput" accept=".csv"/>
    <div id="importStatus" class="meta"></div>
  </div>

  <!-- Practice -->
  <div class="card">
    <div class="row">
      <div id="prompt" class="meta"></div>
      <button id="play">🔊 Play</button>
    </div>
    <input id="answer" type="text" placeholder="Type here and press Enter" autocomplete="off"/>
    <div id="feedback" class="meta"></div>
    <button id="next">Next</button>
  </div>

<script>
let words = JSON.parse(localStorage.getItem("vocatype_words") || "[]");
let i = 0;
let start = Date.now();

const promptEl = document.getElementById("prompt");
const ansEl = document.getElementById("answer");
const fbEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next");
const fileInput = document.getElementById("fileInput");
const importStatus = document.getElementById("importStatus");
const playBtn = document.getElementById("play");

// ---- Speech ----
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  // Try to pick an English voice
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang && v.lang.startsWith("en"));
  if(en) u.voice = en;
  u.rate = 0.9; // slower = clearer for learners
  u.pitch = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function wpm(chars, ms){
  const min = ms/60000;
  return Math.round((chars/5)/Math.max(min,0.001));
}

function show(){
  if(words.length === 0){
    promptEl.innerHTML = "No words loaded. Please import a CSV file.";
    ansEl.disabled = true;
    return;
  }
  ansEl.disabled = false;
  const w = words[i];
  promptEl.innerHTML = `Meaning: <b>${w.zh}</b>`;
  fbEl.textContent = "";
  ansEl.value = "";
  ansEl.focus();
  start = Date.now();
  // auto speak
  speak(w.term);
}

ansEl.addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  if(words.length === 0) return;

  const typed = ansEl.value.trim();
  const target = words[i].term;
  const speed = wpm(typed.length, Date.now()-start);

  if(typed.toLowerCase() === target.toLowerCase()){
    fbEl.innerHTML = `<span class="ok">Correct</span> · ${speed} WPM`;
  }else{
    fbEl.innerHTML = `<span class="bad">Not quite</span> · answer: <b>${target}</b> · ${speed} WPM`;
  }
});

nextBtn.onclick = ()=>{
  if(words.length === 0) return;
  i = (i+1) % words.length;
  show();
};

playBtn.onclick = ()=>{
  if(words.length === 0) return;
  speak(words[i].term);
};

// CSV Import
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    lines.shift(); // remove header

    const imported = lines.map(line => {
      const [term, zh] = line.split(",");
      return { term: term.trim(), zh: zh.trim() };
    }).filter(w => w.term && w.zh);

    words = imported;
    localStorage.setItem("vocatype_words", JSON.stringify(words));
    i = 0;
    importStatus.textContent = `Imported ${words.length} words successfully.`;
    show();
  };
  reader.readAsText(file);
});

show();
</script>
</body>
</html>
